services:
  pg-shard1:
    image: postgres:15
    container_name: pg-shard1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: superpassword
      POSTGRES_DB: homework
    ports:
      - "5434:5432"
    volumes:
      - pg-shard1-data:/var/lib/postgresql/data
    networks:
      - pg-net

  pg-shard2:
    image: postgres:15
    container_name: pg-shard2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: superpassword
      POSTGRES_DB: homework
    ports:
      - "5435:5432"
    volumes:
      - pg-shard2-data:/var/lib/postgresql/data
    networks:
      - pg-net

volumes:
  pg-shard1-data:
  pg-shard2-data:

networks:
  pg-net:
    external: true
    name: hw6_pg-net 
