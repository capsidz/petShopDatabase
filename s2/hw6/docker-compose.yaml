services:
  postgres-master:
    image: postgres:17
    container_name: pg-master
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
    volumes:
      - pg_master_data:/var/lib/postgresql/data
    command: >
      postgres 
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c wal_keep_size=1GB
      -c hot_standby=on
      -c listen_addresses=*
    networks:
      - pg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica1:
    image: postgres:17
    container_name: pg-replica1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pg_replica1_data:/var/lib/postgresql/data
    command: >
      postgres 
      -c hot_standby=on
      -c listen_addresses=*
    networks:
      - pg-network
    depends_on:
      postgres-master:
        condition: service_healthy

  postgres-replica2:
    image: postgres:17
    container_name: pg-replica2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - pg_replica2_data:/var/lib/postgresql/data
    command: >
      postgres 
      -c hot_standby=on
      -c listen_addresses=*
    networks:
      - pg-network
    depends_on:
      postgres-master:
        condition: service_healthy

networks:
  pg-network:
    driver: bridge

volumes:
  pg_master_data:
    driver: local
  pg_replica1_data:
    driver: local
  pg_replica2_data:
    driver: local